; Limites de upload maiores que o padrão do PHP, para suportar o envio de
; várias fotos por registro no RDO e arquivos anexados de obra (DWG/IFC/
; vídeos, até 100MB — ver ArquivoController).
upload_max_filesize = 110M
post_max_size = 120M
; 30/09/2026: 20 era pouco — o RDO aceita até 20 fotos + 5 vídeos NA MESMA
; requisição (até 25 arquivos), e o PHP corta em silêncio qualquer arquivo
; além desse limite ANTES do Laravel sequer ver o request — nenhum erro,
; nenhum log, a foto cortada simplesmente nunca vira registro no banco
; (achado investigando "a imagem não aparece depois de salvar", ver
; docs/CONTEXTO.md). 50 dá bastante folga pro RDO e qualquer outro upload
; múltiplo do sistema.
max_file_uploads = 50

; max_execution_time/memory_limit maiores: a geração de miniatura
; (ffmpeg/Imagick) roda de forma síncrona, dentro da mesma requisição de
; upload, no mesmo worker PHP-FPM — sem isso, um vídeo grande ou PDF
; pesado pode estourar os limites padrão (30s/128M) no meio do processo.
max_execution_time = 120
max_input_time = 120
memory_limit = 256M
