; Limites de upload maiores que o padrão do PHP, para suportar o envio de
; várias fotos por registro no Diário de Obra e arquivos anexados de obra
; (DWG/IFC/vídeos, até 100MB — ver ArquivoController).
upload_max_filesize = 110M
post_max_size = 120M
max_file_uploads = 20

; max_execution_time/memory_limit maiores: a geração de miniatura
; (ffmpeg/Imagick) roda de forma síncrona, dentro da mesma requisição de
; upload, no mesmo worker PHP-FPM — sem isso, um vídeo grande ou PDF
; pesado pode estourar os limites padrão (30s/128M) no meio do processo.
max_execution_time = 120
max_input_time = 120
memory_limit = 256M
