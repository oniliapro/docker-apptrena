<div class="tela-login">
  <form class="cartao-login" [formGroup]="formulario" (ngSubmit)="entrar()">
    <div class="marca">AppTrena</div>
    <h1>Entrar</h1>
    <p class="atenuado">Acesse o painel de controle de obra.</p>

    <label class="campo">
      <span>E-mail</span>
      <input type="email" formControlName="email" autocomplete="username" />
    </label>

    <label class="campo">
      <span>Senha</span>
      <input type="password" formControlName="senha" autocomplete="current-password" />
    </label>

    @if (erro(); as mensagem) {
      <p class="erro" role="alert">{{ mensagem }}</p>
    }

    <button class="primario" type="submit" [disabled]="formulario.invalid || enviando()">
      {{ enviando() ? 'Entrando…' : 'Entrar' }}
    </button>

    <p class="rodape atenuado">
      Não tem conta? <a routerLink="/cadastro">Criar conta</a>
    </p>

    @if (permiteDemonstracao) {
      <div class="separador"><span>ou</span></div>
      <button type="button" class="demonstracao" (click)="entrarSemServidor()">
        Entrar sem servidor
      </button>
      <p class="nota">
        Modo de revisão: abre as telas sem backend. Os dados não carregam —
        serve para conferir layout e navegação durante a migração.
      </p>
    }
  </form>
</div>
