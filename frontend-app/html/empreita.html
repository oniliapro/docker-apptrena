<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Controle de Empreita</title>
  <link rel="stylesheet" href="../css/styles.css" />
</head>
<body data-page="empreita">

<aside class="barra-lateral">
  <div class="barra-lateral-cabecalho">
    <button class="botao-icone" id="alternarBarraLateral" title="Ocultar/mostrar menu">☰</button>
    <div class="barra-lateral-marca">TrenaApp</div>
  </div>
  <nav class="barra-lateral-nav">
    <a href="./index.html"><span class="nav-icone">🏠</span><span class="nav-texto">Início</span></a>
    <a href="./obras.html"><span class="nav-icone">🏗️</span><span class="nav-texto">Lista de Obras</span></a>
    <a href="./eap.html"><span class="nav-icone">🧱</span><span class="nav-texto">Cadastro de EAP</span></a>
    <a href="./empreita.html"><span class="nav-icone">👷</span><span class="nav-texto">Empreita</span></a>
    <a href="./pagamentos.html"><span class="nav-icone">💳</span><span class="nav-texto">Pagamentos</span></a>
    <a href="./mapa.html"><span class="nav-icone">🗺️</span><span class="nav-texto">Mapa</span></a>
    <a href="./mapas.html"><span class="nav-icone">🧾</span><span class="nav-texto">Lista de Mapas</span></a>
    <a href="./empreitas.html"><span class="nav-icone">📋</span><span class="nav-texto">Lista de Empreitas</span></a>
    <a href="./diario-obra.html"><span class="nav-icone">📔</span><span class="nav-texto">Diário de Obra</span></a>
  </nav>
</aside>

<header class="barra-topo">
  <h1 class="titulo-pagina">Controle de Empreita</h1>
  <div class="barra-topo-direita">
    <div class="menu-area">
      <button class="botao-icone" id="botaoMenuUsuario" title="Configuracoes">⚙</button>
      <div class="menu-suspenso oculto" id="menuUsuario">
        <button onclick="abrirConfiguracoes()">Configurações</button>
        <button onclick="sairAplicativo()">Sair</button>
      </div>
    </div>
  </div>
</header>

<main class="conteudo">

<div class="numero-mapa" style="margin-bottom: 6px;">
  <label>Nº Obra</label><input id="numeroObra" type="text" placeholder="Ex.: OB-2026-001" />
  <label>Nº Empreita</label><input id="numeroEmpreita" type="text" placeholder="Ex.: EMP-001" />
</div>

<table class="cabecalho-tabela">
  <tr>
    <td>Descrição</td><td colspan="5"><input id="descricaoEmpreita" placeholder="Descrição da empreita"></td>
  </tr>
  <tr>
    <td>Empreiteiro</td><td colspan="5"><input id="nomeEmpreiteiro" placeholder="Nome do empreiteiro/prestador"></td>
  </tr>
  <tr>
    <td>Data da medição</td><td><input id="dataMedicao" type="date"></td>
    <td>Competência</td><td><input id="competencia" placeholder="Ex.: Jan/2026"></td>
    <td>Observações</td><td><input id="observacoesMedicao" placeholder="Anotações da medição/pagamento"></td>
  </tr>
</table>

<br>

<div class="acoes">
  <button class="sucesso" onclick="adicionarItemEmpreita()">➕ Adicionar serviço</button>
  <button onclick="recarregarEapDoStorage()">🔄 Recarregar EAP</button>
  <button class="primario" onclick="registrarMedicaoPagamento()">💾 Registrar medição/pagamento</button>
</div>

<div class="barra-ferramentas">
  <div class="barra-ferramentas-linha">
    <div class="barra-ferramentas-grupo">
      <span class="barra-ferramentas-rotulo">Tipos no contrato</span>
      <div id="alternanciasTipoEmpreita" class="alternancias-tipo"></div>
    </div>
  </div>
</div>

<div class="envoltoria">
  <table id="tabelaEmpreita">
    <colgroup id="grupoColunasEmpreita"></colgroup>
    <thead id="cabecalhoEmpreita"></thead>
    <tbody id="corpoEmpreita"></tbody>
    <tfoot id="rodapeEmpreita"></tfoot>
  </table>
</div>

<div class="acoes acoes-inferior">
  <button class="primario" onclick="registrarMedicaoPagamento()">💾 Registrar medição/pagamento</button>
</div>

<div class="abaixo-grade">
  <div class="painel">
    <div class="painel-titulo">RESUMO DO PERÍODO</div>
    <div id="painelResumo" class="painel-corpo"></div>
  </div>

  <div class="painel">
    <div class="painel-titulo">REGISTROS</div>
    <div id="painelRegistros" class="painel-corpo"></div>
  </div>
</div>

<script src="../js/shared/backend-storage.js"></script>
<script src="../js/shared/shell.js"></script>
<script src="../js/shared/pagamentos-utils.js"></script>
<script src="../js/shared/obras-api.js"></script>

<!-- SCRIPTS (ORDEM IMPORTA) -->
<script src="../js/empreita/10-empreita-dom.js"></script>
<script src="../js/empreita/11-empreita-state.js"></script>
<script src="../js/empreita/12-empreita-engine.js"></script>
<script src="../js/empreita/13-empreita-render.js"></script>
<script src="../js/empreita/14-empreita-app.js"></script>

</main>

</body>
</html>
