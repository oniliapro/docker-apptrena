<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Diário de Obra</title>
  <link rel="stylesheet" href="../css/styles.css" />
  <style>
    .diario-cartao {
      display: flex;
      gap: 12px;
    }
    .diario-cartao-corpo {
      flex: 1;
      min-width: 0;
    }
    .diario-cartao-cabecalho {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 8px;
      margin-bottom: 4px;
    }
    .diario-data {
      font-weight: 700;
    }
    .diario-fotos {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 8px;
    }
    .diario-foto {
      width: 84px;
      height: 84px;
      object-fit: cover;
      border-radius: var(--raio-sm, 4px);
      border: 1px solid var(--cor-borda, #dde3ea);
      cursor: pointer;
    }
    .diario-vazio {
      text-align: center;
      padding: 24px;
    }
  </style>
</head>
<body data-page="diario-obra">

<aside class="barra-lateral">
  <div class="barra-lateral-cabecalho">
    <button class="botao-icone" id="alternarBarraLateral" title="Ocultar/mostrar menu">☰</button>
    <div class="barra-lateral-marca">TrenaApp</div>
  </div>
  <nav class="barra-lateral-nav">
    <a href="./index.html"><span class="nav-icone">🏠</span><span class="nav-texto">Início</span></a>
    <a href="./obras.html"><span class="nav-icone">🏗️</span><span class="nav-texto">Lista de Obras</span></a>
    <a href="./eap.html"><span class="nav-icone">🧱</span><span class="nav-texto">Cadastro de EAP</span></a>
    <a href="./empreita.html"><span class="nav-icone">👷</span><span class="nav-texto">Empreita</span></a>
    <a href="./pagamentos.html"><span class="nav-icone">💳</span><span class="nav-texto">Pagamentos</span></a>
    <a href="./mapa.html"><span class="nav-icone">🗺️</span><span class="nav-texto">Mapa</span></a>
    <a href="./mapas.html"><span class="nav-icone">🧾</span><span class="nav-texto">Lista de Mapas</span></a>
    <a href="./empreitas.html"><span class="nav-icone">📋</span><span class="nav-texto">Lista de Empreitas</span></a>
    <a href="./diario-obra.html"><span class="nav-icone">📔</span><span class="nav-texto">Diário de Obra</span></a>
  </nav>
</aside>

<header class="barra-topo">
  <h1 class="titulo-pagina">Diário de Obra</h1>
  <div class="barra-topo-direita">
    <div class="menu-area">
      <button class="botao-icone" id="botaoMenuUsuario" title="Configuracoes">⚙</button>
      <div class="menu-suspenso oculto" id="menuUsuario">
        <button onclick="abrirConfiguracoes()">Configurações</button>
        <button onclick="sairAplicativo()">Sair</button>
      </div>
    </div>
  </div>
</header>

<main class="conteudo">

  <div class="painel" style="margin-bottom: 10px;">
    <div class="painel-titulo">OBRA</div>
    <div class="acoes" style="align-items:center;">
      <select id="seletorObra" style="max-width:280px;"></select>
      <button type="button" class="sucesso" onclick="abrirModalNovaObra()">➕ Nova obra</button>
    </div>
  </div>

  <div class="painel" style="margin-bottom: 10px;">
    <div class="painel-titulo">NOVO REGISTRO</div>
    <form id="formDiario">
      <table class="cabecalho-tabela">
        <tr>
          <td>Data</td><td><input id="campoData" type="date" required></td>
          <td>Clima</td><td><input id="campoClima" placeholder="Ex.: Ensolarado"></td>
          <td>Responsável</td><td><input id="campoAutor" placeholder="Ex.: Lucas"></td>
        </tr>
        <tr>
          <td>Título</td><td colspan="5"><input id="campoTitulo" placeholder="Ex.: Concretagem da laje"></td>
        </tr>
      </table>
      <div style="margin-top:8px;">
        <label>Descrição / ocorrências</label>
        <textarea id="campoDescricao" rows="3" style="width:100%; font-family:inherit; font-size:12px; padding:6px; border:1px solid var(--cor-borda-forte,#c3ccd6); border-radius:4px;"></textarea>
      </div>
      <div style="margin-top:8px;">
        <label>Fotos (opcional, até 10)</label><br>
        <input type="file" id="campoFotos" accept="image/*" multiple capture="environment">
      </div>
      <div class="acoes acoes-inferior">
        <button class="primario" type="submit">💾 Salvar registro</button>
        <span id="statusDiario" class="atenuado"></span>
      </div>
    </form>
  </div>

  <div class="painel">
    <div class="painel-titulo">REGISTROS</div>
    <div id="listaDiario"></div>
  </div>

</main>

<!-- MODAL: NOVA OBRA -->
<div id="modalNovaObra" class="modal oculto" aria-hidden="true">
  <div class="modal-fundo" onclick="fecharModalNovaObra()"></div>
  <div class="modal-cartao" style="width:min(420px,92vw);">
    <div class="modal-cabecalho">
      <div class="modal-titulo">Nova obra</div>
      <button type="button" onclick="fecharModalNovaObra()">✖</button>
    </div>
    <div class="modal-corpo">
      <label>Nome da obra</label>
      <input id="campoNovaObraNome" placeholder="Ex.: Residencial Jardins" style="margin-bottom:8px;">
      <label>Cliente</label>
      <input id="campoNovaObraCliente" placeholder="Ex.: João da Silva" style="margin-bottom:8px;">
      <div class="acoes acoes-inferior">
        <button class="primario" type="button" onclick="criarObra()">Criar</button>
        <button type="button" onclick="fecharModalNovaObra()">Cancelar</button>
      </div>
    </div>
  </div>
</div>

<script src="../js/shared/backend-storage.js"></script>
<script src="../js/shared/shell.js"></script>
<script src="../js/shared/obras-api.js"></script>
<script src="../js/diario-obra/01-app.js"></script>
</body>
</html>
