<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Criar conta — Controle de Obra</title>
  <link rel="stylesheet" href="../css/styles.css" />
  <style>
    body.pagina-login {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background: linear-gradient(180deg, #f4f6f9 0%, #eaf2fc 100%);
      padding: 24px 12px;
    }
    .login-caixa {
      width: 100%;
      max-width: 360px;
      padding: 28px 26px 24px;
      border-radius: var(--raio-lg, 12px);
    }
    .login-logo {
      width: 44px;
      height: 44px;
      margin: 0 auto 14px;
      border-radius: 10px;
      background: var(--cor-primaria, #2457a0);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      font-weight: 700;
    }
    .login-titulo {
      text-align: center;
      font-size: 18px;
      font-weight: 700;
      margin-bottom: 2px;
    }
    .login-subtitulo {
      text-align: center;
      margin-bottom: 20px;
      font-size: 12px;
    }
    .login-campo {
      margin-bottom: 14px;
    }
    .login-campo label {
      display: block;
      margin-bottom: 5px;
      font-size: 12px;
      font-weight: 600;
      color: var(--cor-texto-suave, #5b6b7c);
    }
    .login-campo input {
      width: 100%;
      height: 36px;
      padding: 0 10px;
      border: 1px solid var(--cor-borda-forte, #c3ccd6);
      border-radius: 6px;
      font-family: inherit;
      font-size: 13px;
    }
    .login-campo input:focus {
      outline: 2px solid var(--cor-primaria, #2457a0);
      outline-offset: -1px;
    }
    .login-campo-ajuda {
      font-size: 11px;
      color: var(--cor-texto-suave, #5b6b7c);
      margin-top: 4px;
    }
    .login-botao {
      width: 100%;
      height: 38px;
      background: var(--cor-primaria, #2457a0);
      color: #fff;
      border: 1px solid var(--cor-primaria-escura, #173a63);
      border-radius: 6px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 600;
      margin-top: 4px;
      transition: background 0.12s ease;
    }
    .login-botao:hover { background: var(--cor-primaria-escura, #173a63); }
    .login-botao:disabled { opacity: 0.6; cursor: default; }
    .login-erro {
      color: var(--cor-perigo, #c0392b);
      background: var(--cor-perigo-bg, #fdecea);
      border-radius: 6px;
      padding: 8px 10px;
      margin-bottom: 14px;
      font-size: 12px;
      display: none;
    }
  </style>
</head>
<body class="pagina-login" data-page="cadastro">

<div class="login-caixa painel">
  <div class="login-logo">CO</div>
  <div class="login-titulo">Criar conta</div>
  <div class="login-subtitulo atenuado">Controle de Obra — teste grátis por 14 dias</div>

  <div class="login-erro" id="cadastroErro"></div>

  <form id="formCadastro" autocomplete="on">
    <div class="login-campo">
      <label for="campoEmpresa">Nome da empresa</label>
      <input type="text" id="campoEmpresa" name="empresa" autocomplete="organization" required />
    </div>
    <div class="login-campo">
      <label for="campoNome">Seu nome</label>
      <input type="text" id="campoNome" name="name" autocomplete="name" required />
    </div>
    <div class="login-campo">
      <label for="campoEmail">Email</label>
      <input type="email" id="campoEmail" name="email" autocomplete="username" required />
    </div>
    <div class="login-campo">
      <label for="campoSenha">Senha</label>
      <input type="password" id="campoSenha" name="password" autocomplete="new-password" minlength="8" required />
      <div class="login-campo-ajuda">Mínimo 8 caracteres.</div>
    </div>
    <button type="submit" class="login-botao" id="botaoCriar">Criar conta</button>
  </form>

  <div class="login-subtitulo" style="margin-top:14px; margin-bottom:0;">
    Já tem conta? <a href="./login.html">Entrar</a>
  </div>
</div>

<script src="../js/shared/backend-storage.js"></script>
<script>
  (function () {
    const form = document.getElementById("formCadastro");
    const botao = document.getElementById("botaoCriar");
    const erro = document.getElementById("cadastroErro");

    // já logado? manda direto pra home
    if (window.controleObraAuth && window.controleObraAuth.getToken()) {
      location.href = "./index.html";
      return;
    }

    function mostrarErro(msg) {
      erro.textContent = msg;
      erro.style.display = "block";
    }

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      erro.style.display = "none";
      botao.disabled = true;
      botao.textContent = "Criando conta...";

      const empresa = document.getElementById("campoEmpresa").value.trim();
      const nome = document.getElementById("campoNome").value.trim();
      const email = document.getElementById("campoEmail").value.trim();
      const password = document.getElementById("campoSenha").value;

      try {
        const resultado = await window.controleObraAuth.registrar(empresa, nome, email, password);
        if (!resultado.ok) {
          mostrarErro(resultado.mensagem || "Não foi possível criar a conta.");
          return;
        }
        location.href = "./index.html";
      } catch (err) {
        mostrarErro("Não foi possível falar com o servidor. Confira se a API está no ar.");
      } finally {
        botao.disabled = false;
        botao.textContent = "Criar conta";
      }
    });
  })();
</script>
</body>
</html>
