; opcache.validate_timestamps continua ligado (código editado ainda é
; detectado), mas revalida com menos frequência — o padrão (2s) faz o
; PHP checar o mtime de centenas de arquivos do vendor/ em quase toda
; requisição, o que é bem lento quando o código está montado via WSL2
; num drive Windows (/mnt/*). Em troca, uma mudança de código pode levar
; até esse tempo para refletir sem reiniciar o phpfpm.
opcache.revalidate_freq = 60
