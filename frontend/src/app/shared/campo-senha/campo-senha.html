<div class="campo-senha">
  <input
    [id]="idCampo()"
    [type]="visivel() ? 'text' : 'password'"
    [formControl]="controle()"
    [attr.autocomplete]="autocomplete()"
    [placeholder]="placeholder()"
    autocapitalize="none"
    spellcheck="false" />

  <button
    type="button"
    class="botao-olho"
    (click)="alternar()"
    [attr.aria-label]="visivel() ? 'Ocultar senha' : 'Mostrar senha'"
    [attr.aria-pressed]="visivel()"
    [title]="visivel() ? 'Ocultar senha' : 'Mostrar senha'">
    @if (visivel()) {
      <!-- olho riscado: a senha está aparecendo, clicar oculta -->
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M3 3l18 18" />
        <path d="M10.6 6.2A9.6 9.6 0 0 1 12 6c5 0 8.5 4.2 9.5 6-0.4 0.8-1.2 1.9-2.3 3M6.5 7.7C4.4 9 3 10.9 2.5 12c1 1.8 4.5 6 9.5 6 1.5 0 2.8-0.4 4-1" />
        <path d="M9.9 9.9a3 3 0 0 0 4.2 4.2" />
      </svg>
    } @else {
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M2.5 12C3.5 10.2 7 6 12 6s8.5 4.2 9.5 6c-1 1.8-4.5 6-9.5 6s-8.5-4.2-9.5-6z" />
        <circle cx="12" cy="12" r="3" />
      </svg>
    }
  </button>
</div>
