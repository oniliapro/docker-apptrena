@if (papelTimbradoUrl(); as url) {
  <img class="faixa-papel-timbrado" [src]="url" alt="Papel timbrado" />
}

<header class="folha-cabecalho">
  <div class="identidade-empresa">
    @if (logoUrl(); as url) {
      <img class="logo-imagem" [src]="url" [alt]="perfil()?.nome || 'Logomarca'" />
    }
    <div>
      <div class="logo-texto">{{ perfil()?.nome || 'ComTrena' }}</div>
      <div class="subtitulo">{{ subtitulo() }}</div>
    </div>
  </div>
  <div class="info-geracao">
    <div class="gerado-em">Gerado em {{ formatarDataHora(geradoEm()) }}</div>
    <img class="logomarca-comtrena-cabecalho" src="marca/comtrena-logomarca-para-fundo-claro.svg" alt="ComTrena" />
  </div>
</header>
