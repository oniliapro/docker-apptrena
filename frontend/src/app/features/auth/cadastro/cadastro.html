<div class="tela">
  <form class="cartao" [formGroup]="formulario" (ngSubmit)="criar()">
    <div class="marca">AppTrena</div>
    <h1>Criar conta</h1>
    <p class="atenuado sub">
      A conta abre com 14 dias de teste. Você será o administrador da empresa.
    </p>

    <label class="campo">
      <span>Nome da empresa</span>
      <input type="text" formControlName="empresa" autocomplete="organization"
             placeholder="Ex.: Construtora Alicerce" />
      @if (temErro('empresa')) {
        <small class="erro-campo">Informe o nome da empresa.</small>
      }
    </label>

    <label class="campo">
      <span>Seu nome</span>
      <input type="text" formControlName="nome" autocomplete="name" />
      @if (temErro('nome')) {
        <small class="erro-campo">Informe seu nome.</small>
      }
    </label>

    <label class="campo">
      <span>E-mail</span>
      <input type="email" formControlName="email" autocomplete="email" />
      @if (temErro('email')) {
        <small class="erro-campo">Informe um e-mail válido.</small>
      }
    </label>

    <label class="campo">
      <span>Senha</span>
      <input type="password" formControlName="senha" autocomplete="new-password" />
      @if (temErro('senha')) {
        <small class="erro-campo">A senha precisa ter ao menos 8 caracteres.</small>
      }
    </label>

    <label class="campo">
      <span>Repita a senha</span>
      <input type="password" formControlName="confirmacao" autocomplete="new-password" />
      @if (senhasDiferentes) {
        <small class="erro-campo">As senhas não são iguais.</small>
      }
    </label>

    @if (erro(); as mensagem) {
      <p class="erro" role="alert">{{ mensagem }}</p>
    }

    <button class="primario" type="submit" [disabled]="formulario.invalid || enviando()">
      {{ enviando() ? 'Criando…' : 'Criar conta' }}
    </button>

    <p class="rodape atenuado">
      Já tem conta? <a routerLink="/login">Entrar</a>
    </p>
  </form>
</div>
